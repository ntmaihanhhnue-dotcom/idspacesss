<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>iDSpace Home Studio – Hình dung ngôi nhà của bạn</title>
<meta name="description" content="Hình dung ngôi nhà mơ ước, nhận ước tính phí thiết kế sơ bộ và đặt lịch tư vấn miễn phí với kiến trúc sư Kiến Trúc iDSpace.">
<meta name="theme-color" content="#43536D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Roboto:wght@400;500;700&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#43536D; --ink-2:#36445A; --side:#2F3B50; --accent:#4A6590; --bg:#F4F3F0; --card:#FDFDFB;
  --line:#E2E0DA; --muted:#656B76; --danger:#B3402F;
  --head:'Roboto Condensed','Roboto',Arial,sans-serif; --sans:'Roboto','Helvetica Neue',Arial,sans-serif; --ui:'Montserrat','Roboto',Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:280px 1fr;grid-template-rows:auto 1fr;min-height:100vh}
header.top{grid-column:1/-1;display:flex;align-items:center;gap:24px;padding:12px 28px;background:var(--ink);color:#fff}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:12px;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:22px}
.brand b{display:block;font-family:var(--head);font-weight:700;font-size:19px;line-height:1.2;letter-spacing:.02em}
.brand small{color:var(--muted);font-size:12.5px}
.proj{padding-left:24px;border-left:1px solid var(--line);flex:1;min-width:0}
.proj small{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.proj input{border:0;background:transparent;font-weight:600;font-size:16px;padding:0;width:100%;outline:none}
.saved{font-size:12.5px;color:var(--accent)}
.btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 20px;cursor:pointer;font-weight:500;transition:.15s}
.btn:hover{border-color:var(--accent)}
a.btn{text-decoration:none;display:inline-block}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.primary:hover{background:var(--ink-2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
header.top .brand small,header.top .proj small,header.top .saved{color:#B4C0D4}
.eyebrow,.btn,.step,.chip,.opt b,.fld label,nav.side .k,nav.side .prog,.proj small,.pill,.summary dt{font-family:var(--ui)}
.btn{font-size:13.5px;font-weight:600;letter-spacing:.03em}
.step{font-size:13.5px;letter-spacing:.02em}.step.active{font-weight:700}
.chip{font-size:13.5px;font-weight:500}
.opt b{font-size:14.5px;font-weight:600}
.fld label{font-size:12.5px;font-weight:600;letter-spacing:.02em}
.eyebrow{font-weight:600;letter-spacing:.18em}
.lead{font-size:18px;line-height:1.65}
header.top .proj{border-left-color:rgba(255,255,255,.22)}
header.top .proj input{color:#fff}
header.top .logo{background:rgba(255,255,255,.16)}
header.top .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.45)}
header.top .btn:hover{background:rgba(255,255,255,.12);border-color:#fff}
nav.side{background:var(--side);color:#DDE3EE;padding:28px 18px;overflow:auto}
nav.side .k{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#9FAEC4;padding:0 8px}
nav.side h3{font-family:var(--head);font-weight:700;margin:4px 8px 2px;color:#fff;font-size:21px;letter-spacing:.01em}
nav.side .prog{font-size:12px;color:#9FAEC4;margin:0 8px 22px;letter-spacing:.06em}
.step{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:transparent;color:inherit;padding:13px 14px;border-radius:14px;cursor:pointer;margin-bottom:6px}
.step .ic{width:22px;text-align:center;font-size:17px}
.step .n{margin-left:auto;font-size:11px;letter-spacing:.12em;color:#8795AD}
.step.active{background:#F4F3F0;color:var(--ink);font-weight:600}
.step.done .ic{color:#9CC0E0}
.step:disabled{opacity:.45;cursor:not-allowed}
main{padding:28px 32px 120px;overflow:auto;min-width:0}
.wrap{max-width:1000px;margin:0 auto}
.eyebrow{font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);font-weight:700}
h1{font-family:var(--head);font-weight:700;font-size:clamp(34px,5.4vw,64px);line-height:1.08;margin:10px 0 14px;letter-spacing:0}
.lead{font-size:18px;color:var(--muted);max-width:720px;margin:0 0 28px}
.card{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:28px;margin-bottom:20px}
.card h2{font-family:var(--head);font-weight:700;font-size:25px;line-height:1.2;margin:0 0 6px}
.card p.sub{margin:0 0 18px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.fld label{font-size:13.5px;font-weight:600}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:#fff;outline:none;width:100%}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(74,101,144,.18)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 18px;cursor:pointer;font-weight:500}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.seg{display:flex;gap:10px;flex-wrap:wrap}
.opt{flex:1;min-width:150px;border:1.5px solid var(--line);background:#fff;border-radius:18px;padding:16px;cursor:pointer;text-align:left}
.opt b{display:block}.opt span{font-size:13.5px;color:var(--muted)}
.opt.on{border-color:var(--ink);background:#EEF1F6}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:20px;cursor:pointer}
.stepper output{min-width:28px;text-align:center;font-weight:700;font-size:18px}
.drop{display:flex;gap:10px;flex-wrap:wrap}
.drop label{flex:1;min-width:130px;text-align:center;border:1.5px dashed var(--accent);color:var(--accent);border-radius:16px;padding:14px;font-weight:600;cursor:pointer}
.drop input{display:none}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.thumbs div{position:relative;aspect-ratio:4/3;border-radius:14px;overflow:hidden;background:#E9E6DC}
.thumbs img{width:100%;height:100%;object-fit:cover}
.thumbs button{position:absolute;top:6px;right:6px;border:0;background:rgba(0,0,0,.6);color:#fff;border-radius:50%;width:26px;height:26px;cursor:pointer}
.stage{min-height:260px;border-radius:20px;background:#EFEDE3;display:grid;place-items:center;text-align:center;padding:24px;color:var(--muted)}
.stage img{max-width:100%;border-radius:16px}
.pill{display:inline-block;background:#E6ECF4;color:var(--accent);border-radius:999px;padding:6px 14px;font-weight:600;font-size:13px}
.proj-card{border:1px solid var(--line);border-radius:20px;overflow:hidden;background:#fff;text-decoration:none;color:inherit;display:block}
.proj-card .ph{aspect-ratio:16/9;background:linear-gradient(135deg,#C9D1DE,#8C9BB3);overflow:hidden}
.proj-card .ph img{width:100%;height:100%;object-fit:cover;display:block}
.logoimg{height:40px;width:auto;max-width:170px;object-fit:contain;display:block}
.proj-card div.t{padding:14px 16px}.proj-card b{display:block}.proj-card small{color:var(--muted)}
.est{background:var(--ink);color:#fff;border-radius:26px;padding:34px;margin-bottom:20px}
.est .big{font-family:var(--head);font-weight:700;font-size:clamp(34px,6vw,56px);line-height:1.1;margin:8px 0}
.est small{color:#BCC8DA}
.kv{display:grid;grid-template-columns:1fr auto;gap:8px 20px;margin-top:18px;border-top:1px solid rgba(255,255,255,.15);padding-top:16px}
.kv span:nth-child(even){text-align:right;font-weight:600}
.summary{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;font-size:14.5px}
.summary dt{color:var(--muted)}.summary dd{margin:0;font-weight:600}
.err{color:var(--danger);font-size:13px;min-height:18px}
footer.bar{position:fixed;left:280px;right:0;bottom:0;background:rgba(253,252,248,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:14px 32px;display:flex;align-items:center;justify-content:space-between;gap:12px;z-index:5}
footer.bar .note{font-size:13px;color:var(--muted);text-align:center;flex:1}
.hp{position:absolute;left:-9999px}
.thanks{text-align:center;padding:40px 10px}
.thanks h1{font-size:clamp(30px,5vw,48px)}
.cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.cta a{text-decoration:none}
@media(max-width:900px){
  .app{grid-template-columns:1fr}
  header.top{padding:12px 16px;gap:12px;flex-wrap:wrap}
  .proj{padding-left:12px}.saved{display:none}
  nav.side{padding:10px 12px;display:flex;gap:6px;overflow-x:auto;position:sticky;top:0;z-index:4}
  nav.side .k,nav.side h3{display:none}
  nav.side .prog{display:none}
  .step{flex:0 0 auto;width:auto;padding:9px 14px;margin:0;white-space:nowrap}
  .step .n{display:none}
  main{padding:20px 16px 120px}
  .grid2,.grid3{grid-template-columns:1fr}
  footer.bar{left:0;padding:12px 16px}footer.bar .note{display:none}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand" id="brand"></div>
    <div class="proj"><small>Dự án đang thiết kế</small><input id="projName" value="Nhà của mình" aria-label="Tên dự án" maxlength="40"></div>
    <span class="saved">Đã lưu trên thiết bị</span>
    <a class="btn" id="hdrContact" href="#" target="_blank" rel="noopener">Liên hệ</a>
  </header>
  <nav class="side" id="side"></nav>
  <main><div class="wrap" id="view"></div></main>
  <footer class="bar" id="bar"></footer>
</div>

  ["Tiết kiệm chi phí &amp; thời gian","Đồng hành từ thiết kế đến giám sát thi công, đảm bảo tiến độ và chất lượng."]
];
const KEY = "idspace_home_v1";
const def = {step:0,maxStep:0,name:"Nhà của mình",mode:"new",type:"villa",styles:[],province:"",area:"",width:"",dir:"Chưa xác định",floors:2,members:4,bedrooms:3,needs:[],date:"",slot:"Sáng (8h–12h)",cname:"",phone:"",email:"",note:"",done:false};
let S = Object.assign({}, def, load());
let photos = [];           // chỉ giữ trong bộ nhớ (ảnh lớn, không lưu localStorage)
let aiResult = null, aiMsg = "";
const $ = s => document.querySelector(s);
const esc = v => String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function load(){ try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}} }
function save(){ try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){} }
const money = n => Math.round(n/1e5)/10 + " triệu"; // làm tròn 0,1 triệu
const fmtM = n => new Intl.NumberFormat("vi-VN").format(Math.round(n/1e6*10)/10);

function calc(){
  const area = +S.area||0;
  const floor = area * S.floors * CONFIG.FLOOR_AREA_FACTOR;
  const fee = floor * CONFIG.DESIGN_FEE_PER_M2;
  return {area, floor, fee, lo: fee*(1-CONFIG.ESTIMATE_RANGE), hi: fee*(1+CONFIG.ESTIMATE_RANGE)};
}

const VIEWS = [viewIdea,viewLand,viewFamily,viewEst,viewBook];
function renderBar(){
  const last = S.step===STEPS.length-1;
  if(S.done){ $("#bar").style.display="none"; return; }
  $("#bar").style.display="flex";
  $("#bar").innerHTML = `<button class="btn" data-back ${S.step===0?'disabled':''}>← Quay lại</button>
    <div class="note">Thiết kế đã lưu trên thiết bị.</div>
    <button class="btn primary" data-next>${last?'Đặt lịch tư vấn miễn phí':'Tiếp: '+STEPS[S.step+1].label+' →'}</button>`;
}
function render(keepScroll){
  renderSide();
  $("#view").innerHTML = VIEWS[S.step]();
  renderBar();
  if(!keepScroll) window.scrollTo({top:0});
  $("#projName").value = S.name;
}

/* ---------- ĐIỀU HƯỚNG & KIỂM TRA ---------- */
function go(i){ S.step=i; S.maxStep=Math.max(S.maxStep,i); save(); render(); }
function validate(step){
  if(step===1 && !(+S.area>0)){ render(true); const e=$("#e-area"); if(e) e.textContent="Vui lòng nhập diện tích đất."; return false; }
  return true;
}
function submit(){
  const errs = {};
  if(S.cname.trim().length<2) errs.cname="Vui lòng nhập họ tên.";
  if(!/^(0|\+?84)\d{9,10}$/.test(S.phone.replace(/[\s.\-]/g,""))) errs.phone="Số điện thoại chưa đúng.";
  if(!S.date) errs.date="Vui lòng chọn ngày.";
  Object.keys({cname:1,phone:1,date:1}).forEach(k=>{const e=$("#e-"+k); if(e) e.textContent=errs[k]||"";});
  if(Object.keys(errs).length) return;
  if($("#hp").value) return; // chống bot
  const c = calc();
  const payload = {
    thoiGian:new Date().toLocaleString("vi-VN"), hoTen:S.cname.trim(), sdt:S.phone.trim(), email:S.email.trim(),
    ngayHen:S.date, khungGio:S.slot, ghiChu:S.note.trim(), tenDuAn:S.name,
    hinhThuc:S.mode==="new"?"Nhà mới":"Cải tạo", loai:S.type==="villa"?"Biệt thự":"Nhà phố",
    phongCach:S.styles.join(", "), tinhThanh:S.province, dienTichDat:S.area, matTien:S.width, huong:S.dir,
    soTang:S.floors, soNguoi:S.members, soPhongNgu:S.bedrooms, nhuCau:S.needs.join(", "),
    phiThietKeUocTinh: c.area>0 ? Math.round(c.lo)+" - "+Math.round(c.hi) : "", nguon:location.href
  };
  const btn=$("[data-next]"); btn.disabled=true; btn.textContent="Đang gửi…";
  const finish=()=>{ S.done=true; save(); render(); };
  if(!CONFIG.SHEET_URL){
    console.warn("[iDSpace] Chưa cấu hình SHEET_URL – dữ liệu chỉ lưu tạm trên máy.", payload);
    try{localStorage.setItem("idspace_pending",JSON.stringify(payload))}catch(e){}
    return finish();
  }
  fetch(CONFIG.SHEET_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)})
    .then(finish).catch(()=>{ btn.disabled=false; btn.textContent="Đặt lịch tư vấn miễn phí"; alert("Gửi chưa thành công. Vui lòng thử lại hoặc gọi trực tiếp cho iDSpace."); });
}

/* ---------- AI (giai đoạn 2) ---------- */
async function runAI(){
  if(!CONFIG.AI_ENDPOINT){ aiMsg="Tính năng AI đang được chuẩn bị. Bạn có thể gửi ảnh cho kiến trúc sư qua Zalo/Messenger khi đặt lịch."; return render(true); }
  aiMsg="Đang tạo phương án…"; render(true);
  try{
    const r = await fetch(CONFIG.AI_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({image:photos[0],styles:S.styles,type:S.type})});
    const j = await r.json(); aiResult=j.imageUrl||null; aiMsg=aiResult?"":"Chưa tạo được phương án, vui lòng thử lại.";
  }catch(e){ aiMsg="Chưa tạo được phương án, vui lòng thử lại."; }
  render(true);
}
function readPhoto(file){
  return new Promise(res=>{
    const img=new Image(), fr=new FileReader();
    fr.onload=()=>{ img.onload=()=>{ const m=1280, k=Math.min(1,m/Math.max(img.width,img.height));
      const cv=document.createElement("canvas"); cv.width=img.width*k; cv.height=img.height*k;
      cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height); res(cv.toDataURL("image/jpeg",.82)); }; img.src=fr.result; };
    fr.readAsDataURL(file);
  });
}

/* ---------- SỰ KIỆN ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("button,[data-go]"); if(!t) return;
  if(t.dataset.go!==undefined && t.classList.contains("step")) return go(+t.dataset.go);
  if(t.dataset.next!==undefined){ if(S.step===STEPS.length-1) return submit(); if(!validate(S.step)) return; return go(S.step+1); }
  if(t.dataset.back!==undefined) return go(S.step-1);
  if(t.dataset.set){ S[t.dataset.set]=t.dataset.v; save(); return render(true); }
  if(t.dataset.multi){ const k=t.dataset.multi, v=t.dataset.v, max=+t.dataset.max, a=S[k];
    if(a.includes(v)) S[k]=a.filter(x=>x!==v); else if(a.length<max) S[k]=[...a,v]; save(); return render(true); }
  if(t.dataset.stepKey){ const k=t.dataset.stepKey; S[k]=Math.min(+t.dataset.max,Math.max(+t.dataset.min,S[k]+ +t.dataset.d)); save(); return render(true); }
  if(t.dataset.rm!==undefined){ photos.splice(+t.dataset.rm,1); aiResult=null; return render(true); }
  if(t.dataset.ai!==undefined) return runAI();
  if(t.dataset.reset!==undefined){ if(confirm("Bắt đầu một dự án mới?")){ S=Object.assign({},def); photos=[]; aiResult=null; save(); render(); } }
});
document.addEventListener("input",e=>{ const k=e.target.dataset&&e.target.dataset.k; if(k){ S[k]=e.target.value; save(); } });
document.addEventListener("change",async e=>{
  if(e.target.matches("[data-photo]")){
    for(const f of [...e.target.files]){ if(photos.length>=3) break; photos.push(await readPhoto(f)); }
    aiResult=null; aiMsg=""; render(true);
  }
});
$("#projName").addEventListener("input",e=>{ S.name=e.target.value||"Nhà của mình"; save(); const h=document.querySelector("nav.side h3"); if(h) h.textContent=S.name; });

/* ---------- KHỞI ĐỘNG ---------- */
// Logo thương hiệu (nếu ảnh lỗi thì dùng biểu tượng ngôi nhà)
(function(){
  const b = $("#brand"), txt = `<div style="padding-left:14px;border-left:1px solid rgba(255,255,255,.25)"><b>Home Studio</b><small>Không gian sống của bạn</small></div>`;
  const fallback = () => { b.innerHTML = `<div class="logo">⌂</div><div><b>iDSpace Home Studio</b><small>Không gian sống của bạn</small></div>`; };
  if(!CONFIG.LOGO_URL) return fallback();
  b.innerHTML = `<img class="logoimg" alt="Kiến Trúc iDSpace" src="${CONFIG.LOGO_URL}">${txt}`;
  b.querySelector("img").addEventListener("error", fallback);
})();
const hc = $("#hdrContact");
if(CONFIG.HOTLINE){ hc.href = "tel:" + CONFIG.HOTLINE; hc.textContent = "Gọi " + (CONFIG.HOTLINE_LABEL||CONFIG.HOTLINE); hc.removeAttribute("target"); }
else hc.href = CONFIG.ZALO_URL || CONFIG.MESSENGER_URL || CONFIG.SITE_URL;
render();
</script>
